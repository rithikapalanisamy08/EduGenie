```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduGenie - AI Learning Companion</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header class="header">
            <h1>EduGenie</h1>
            <p>AI-Powered Learning Companion</p>
        </header>


        <!-- Main Form -->
        <main class="main-content">

            <div class="card">

                <h2>Learn Smarter with EduGenie</h2>

                <p class="description">
                    Select a learning task, enter your content,
                    and let EduGenie assist you.
                </p>


                <!-- Task Selection -->
                <form id="eduForm">

                    <label for="task">
                        Select Task
                    </label>

                    <select id="task" name="task" required>

                        <option value="">
                            -- Select a Task --
                        </option>

                        <option value="explain">
                            Explain
                        </option>

                        <option value="qna">
                            QnA
                        </option>

                        <option value="quiz">
                            Quiz
                        </option>

                        <option value="summary">
                            Summary
                        </option>

                        <option value="learning-path">
                            Recommend Path
                        </option>

                    </select>


                    <!-- User Input -->
                    <label for="userInput">
                        Enter Your Input
                    </label>

                    <textarea
                        id="userInput"
                        name="userInput"
                        rows="8"
                        placeholder="Enter your question, topic, or passage here..."
                        required>
                    </textarea>


                    <!-- Submit Button -->
                    <button type="submit">
                        Generate
                    </button>

                </form>


                <!-- Result Container -->
                <div
                    id="result"
                    class="result-container">

                    <h3>Result</h3>

                    <p>
                        Your AI-generated result will appear here.
                    </p>

                </div>

            </div>

        </main>


        <!-- Footer -->
        <footer class="footer">

            <p>
                EduGenie | AI-Powered Learning Companion
            </p>

        </footer>

    </div>


    <!-- Frontend Interaction -->
    <script>

        const form = document.getElementById("eduForm");

        const task = document.getElementById("task");

        const userInput = document.getElementById("userInput");

        const result = document.getElementById("result");


        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            const selectedTask = task.value;

            const input = userInput.value.trim();


            if (!selectedTask || !input) {

                result.innerHTML = `
                    <h3>Error</h3>
                    <p>Please select a task and enter your input.</p>
                `;

                return;
            }


            result.innerHTML = `
                <h3>Processing...</h3>
                <p>EduGenie is generating your response...</p>
            `;


            let endpoint = "";


            if (selectedTask === "explain") {

                endpoint = "/explain";

            }

            else if (selectedTask === "qna") {

                endpoint = "/ask";

            }

            else if (selectedTask === "quiz") {

                endpoint = "/quiz";

            }

            else if (selectedTask === "summary") {

                endpoint = "/summary";

            }

            else if (selectedTask === "learning-path") {

                endpoint = "/learning-path";

            }


            try {

                const formData = new FormData();


                if (selectedTask === "explain") {

                    formData.append("topic", input);

                }

                else if (selectedTask === "qna") {

                    formData.append("question", input);

                }

                else if (selectedTask === "quiz") {

                    formData.append("passage", input);

                }

                else if (selectedTask === "summary") {

                    formData.append("text", input);

                }

                else if (selectedTask === "learning-path") {

                    formData.append("topic", input);

                    formData.append("level", "Beginner");

                }


                const response = await fetch(
                    endpoint,
                    {
                        method: "POST",
                        body: formData
                    }
                );


                const data = await response.text();


                result.innerHTML = data;

            }


            catch (error) {

                result.innerHTML = `
                    <h3>Error</h3>
                    <p>
                        Something went wrong.
                        Please try again.
                    </p>
                `;

            }

        });

    </script>

</body>

</html>
```
